services:
  app:
    build: .
    ports:
      - '8080:8080'
    volumes:
      - runtime_data:/var/www/html/runtime
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app
volumes:
  runtime_data:
  caddy_data:
